[project]
name = "welding-path-vla"
version = "0.1.0"
description = "Reproducible simulation, data collection, training and deployment tools for robotic welding research."
authors = [{ name = "Mintinson", email = "1315423629@qq.com" }]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["numpy>=2.2,<2.3", "pyyaml>=6.0,<7", "scipy>=1.15,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.2,<2.3"
scipy = ">=1.15,<2"
pyyaml = ">=6.0,<7"
packaging = ">=24.2,<26"
fsspec = ">=2023.1,<=2026.2"
aiohttp = ">=3.10,<4"
setuptools = ">=71,<81"
tqdm = ">=4.69.0,<5"

[tool.pixi.pypi-dependencies]
welding-path-vla = { path = ".", editable = true }
draccus = "==0.10.0"

[tool.pixi.feature.sim.dependencies]
mujoco = "3.10.*"
ffmpeg = "8.1.*"

[tool.pixi.feature.sim.pypi-dependencies]
# 1.5.2 固定 NumPy 1.x，与 LeRobot 0.6 的 NumPy 2.x 约束冲突。
robosuite = "==1.5.1"
lerobot = { version = "==0.6.0", extras = ["dataset"] }
opencv-python = "==4.13.0.92"
opencv-python-headless = "==4.13.0.92"

[tool.pixi.feature.data.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["dataset"] }
opencv-python-headless = "==4.13.0.92"

[tool.pixi.feature.data.dependencies]
ffmpeg = "8.1.*"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "2.9.1.*"
torchvision = "0.24.1.*"

[tool.pixi.feature.cpu.pypi-dependencies]
torchcodec = "==0.9.1"

[tool.pixi.feature.real.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["core-scripts"] }

[tool.pixi.feature.train.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["peft", "pi", "training", "smolvla"] }
torchcodec = "==0.11.1"

[tool.pixi.feature.deploy.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["peft", "pi", "smolvla"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9,<10"
ruff = ">=0.15,<0.16"

[tool.pixi.feature.dev.pypi-dependencies]
basedpyright = ">=1.31,<2"

[tool.pixi.environments]
default = { features = ["sim", "data", "cpu", "dev"], solve-group = "local" }
sim = { features = ["sim"], solve-group = "local" }
data = { features = ["data", "cpu"], solve-group = "local" }
real = { features = ["real", "cpu"], solve-group = "local" }
train = { features = ["train"], solve-group = "cuda" }
deploy = { features = ["real", "deploy"], solve-group = "cuda" }
policy-sim = { features = ["sim", "train"], solve-group = "policy-sim" }
dev = { features = ["sim", "data", "cpu", "dev"], solve-group = "local" }

[tool.pixi.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "basedpyright src scripts"
test = "pytest -q"
check = { depends-on = ["lint", "typecheck", "test"] }
sim-view = "python scripts/view_simulation.py"
sim-collect = "python scripts/collect_simulation_data.py"
sim-replay = "python scripts/replay_episode.py"
data-validate = "python scripts/validate_dataset.py"
evaluate-episode = "python scripts/evaluate.py --mode=episode"
evaluate-dataset = "python scripts/evaluate.py --mode=dataset"
export-lerobot = "python scripts/export_lerobot.py"
robot-config = "python scripts/show_robot_config.py"
policy-config = "python scripts/show_policy_config.py"
train-policy = "python scripts/train_policy.py"
# 在 2×A100 服务器上启动两个 DDP 进程；batch_size 是每张卡的 batch。
train-policy-2gpu = "accelerate launch --num_processes=2 scripts/train_policy.py"
policy-data-check = "python scripts/check_policy_data.py"
policy-evaluate = "python scripts/evaluate_policy.py"
policy-sim-deploy = "python scripts/deploy_simulation_policy.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["repo", "line2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = ".pixi/envs"
venv = "dev"
reportAttributeAccessIssue = false
reportMissingImports = false
