[project]
name = "welding-path-vla"
version = "0.1.0"
description = "Reproducible simulation, data collection, training and deployment tools for robotic welding research."
authors = [{ name = "Mintinson", email = "1315423629@qq.com" }]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["numpy>=2.2,<2.3", "pyyaml>=6.0,<7", "scipy>=1.15,<2"]

[project.urls]
Homepage = "https://github.com/Mintinson/welding_path_vla"
Repository = "https://github.com/Mintinson/welding_path_vla"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.2,<2.3"
scipy = ">=1.15,<2"
pyyaml = ">=6.0,<7"
packaging = ">=24.2,<26"
fsspec = ">=2023.1,<=2026.2"
aiohttp = ">=3.10,<4"
setuptools = ">=71,<81"
tqdm = ">=4.69.0,<5"
mujoco = "3.10.*"
ffmpeg = "8.1.*"
pytest = ">=9,<10"
ruff = ">=0.15,<0.16"

[tool.pixi.pypi-dependencies]
welding-path-vla = { path = ".", editable = true }
draccus = "==0.10.0"
# 1.5.2 固定 NumPy 1.x，与 LeRobot 0.6 的 NumPy 2.x 约束冲突。
robosuite = "==1.5.1"
lerobot = { version = "==0.6.0", extras = ["core-scripts", "dataset", "viz", "peft", "pi", "training", "smolvla", "xvla"] }
opencv-python = "==4.13.0.92"
opencv-python-headless = "==4.13.0.92"
# 统一沿用训练环境的 PyTorch；TorchCodec 0.11 与 PyTorch 2.11 配套。
torch = "==2.11.0"
torchvision = "==0.26.0"
torchcodec = "==0.11.1"
timm = ">=1.0,<2"
cps-client = { path = "packages/cps_client", editable = true }
lerobot-robot-welding = { path = "packages/lerobot_robot_welding", editable = true }
basedpyright = ">=1.31,<2"
deepdiff = ">=7.0.1,<9"

[tool.pixi.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "basedpyright src scripts"
test = "pytest -q"
check = { depends-on = ["lint", "typecheck", "test"] }
sim-view = "python scripts/view_simulation.py"
sim-collect = "python scripts/collect_simulation_data.py"
sim-replay = "python scripts/replay_episode.py"
rerender-dataset = "python scripts/rerender_dataset.py"
data-validate = "python scripts/validate_dataset.py"
evaluate-episode = "python scripts/evaluate.py --mode=episode"
evaluate-dataset = "python scripts/evaluate.py --mode=dataset"
export-lerobot = "python scripts/export_lerobot.py"
migrate-task-parameters = "python scripts/migrate_task_parameters.py"
upload-lerobot = "python scripts/upload_lerobot_dataset.py"
robot-config = "python scripts/show_robot_config.py"
policy-config = "python scripts/show_policy_config.py"
train-policy = "python scripts/train_policy.py"
# 在 2×A100 服务器上启动两个 DDP 进程；batch_size 是每个进程、每张卡的 batch。
train-policy-2gpu = "accelerate launch --num_processes=2 scripts/train_policy.py"
train-xvla-2gpu = "accelerate launch --num_processes=2 scripts/train_xvla.py --config_path=configs/xvla_a100.yaml"
policy-data-check = "python scripts/check_policy_data.py"
lerobot-info = "python scripts/inspect_lerobot_dataset.py"
prepare-real-data = "python scripts/prepare_real_dataset.py"
record-real = "python scripts/record_real.py --config_path=configs/real_record.yaml"
check-real-devices = "python scripts/check_real_devices.py"
preview-real = "python scripts/preview_real.py"
policy-evaluate = "python scripts/evaluate_policy.py"
policy-sim-deploy = "python scripts/deploy_simulation_policy.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["repo", "line2"]
extend-exclude = ["packages/cps_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/cps_client", "packages/lerobot_robot_welding"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = ".pixi/envs"
venv = "default"
reportAttributeAccessIssue = false
reportMissingImports = false
