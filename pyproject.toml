[project]
name = "welding-path-vla"
version = "0.1.0"
description = "Reproducible simulation, data collection, training and deployment tools for robotic welding research."
authors = [{ name = "Mintinson", email = "1315423629@qq.com" }]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["numpy>=2.2,<2.3", "pyyaml>=6.0,<7", "scipy>=1.15,<2"]

[project.scripts]
welding-vla = "welding_path_vla.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.2,<2.3"
scipy = ">=1.15,<2"
pyyaml = ">=6.0,<7"
packaging = ">=24.2,<26"
fsspec = ">=2023.1,<=2026.2"
aiohttp = ">=3.10,<4"
setuptools = ">=71,<81"
tqdm = ">=4.69.0,<5"

[tool.pixi.pypi-dependencies]
welding-path-vla = { path = ".", editable = true }

[tool.pixi.feature.sim.dependencies]
mujoco = "3.10.*"
ffmpeg = "8.1.*"
opencv = ">=4.11,<5"

[tool.pixi.feature.data.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["dataset"] }

[tool.pixi.feature.data.dependencies]
ffmpeg = "8.1.*"
opencv = ">=4.11,<5"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "2.9.1.*"
torchvision = "0.24.1.*"

[tool.pixi.feature.real.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["core-scripts"] }

[tool.pixi.feature.train.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["training", "smolvla"] }

[tool.pixi.feature.deploy.pypi-dependencies]
lerobot = { version = "==0.6.0", extras = ["smolvla"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9,<10"
ruff = ">=0.15,<0.16"

[tool.pixi.feature.dev.pypi-dependencies]
basedpyright = ">=1.31,<2"

[tool.pixi.environments]
default = { features = ["sim", "data", "cpu", "dev"], solve-group = "local" }
sim = { features = ["sim"], solve-group = "local" }
data = { features = ["data", "cpu"], solve-group = "local" }
real = { features = ["real", "cpu"], solve-group = "local" }
train = { features = ["train"], solve-group = "cuda" }
deploy = { features = ["real", "deploy"], solve-group = "cuda" }
dev = { features = ["sim", "data", "cpu", "dev"], solve-group = "local" }

[tool.pixi.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "basedpyright src"
test = "pytest -q"
check = { depends-on = ["lint", "typecheck", "test"] }
sim-view = "welding-vla sim view"
sim-collect = "welding-vla sim collect"
sim-replay = "welding-vla sim replay"
data-validate = "welding-vla data validate"
export-lerobot = "welding-vla data export-lerobot"
robot-config = "welding-vla robot show-config"
policy-config = "welding-vla policy show-config"
train-policy = "welding-vla policy train"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["repo", "line2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = ".pixi/envs"
venv = "dev"
reportAttributeAccessIssue = false
reportMissingImports = false
