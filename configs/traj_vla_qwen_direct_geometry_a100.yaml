includes:
  - traj_vla_qwen_a100.yaml

policy:
  checkpoint: null
  parameters:
    # 语义分支保留每相机 256 个融合 token；factor=1 的冻结投影为恒等映射。
    token_merge_factor: 1
    train_token_merger: false
    use_geometry_branch: true
    geometry_attention_mode: direct
    train_geometry_encoder: true
    train_geometry_resampler: false
    # 新路径替代 latent CA，不叠加旧旁路或依赖 latent 的辅助模块。
    use_dense_geometry_attention: false
    use_geometry_grounding: false
    geometry_readout_from_latents: false
    use_motion_latent: false
    training_stage: standard
    # 保持原基线的输入约定和学习率轨迹，只进行视觉架构升级。
    scale_context_embeddings: true
    scheduler_auto_scale: false

training:
  output_dir: outputs/train_v2/traj_vla_qwen_direct_geometry_curve_plate
  include_tasks: [curve_plate]
  image_aug: true
  steps: 100000
  save_freq: 20000
  resume: false
  peft: null

deployment:
  mode: scene
  include_tasks: [curve_plate]
  action_steps: 8
