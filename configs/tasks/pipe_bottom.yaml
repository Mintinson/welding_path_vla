workpiece:
  kind: pipe_on_plate

task:
  task_id: pipe_bottom
  instruction: Weld along the lower circular fillet seam where the pipe meets the base plate.
  seam_id: pipe_bottom
  direction: forward
  # 真实可达工作区内的前侧四分之一圆弧；可按实验需要覆盖修改。
  arc_start_deg: -90.0
  arc_sweep_deg: 90.0
  # 接近阶段继承 60 mm/s；焊接阶段降为 4 mm/s。
  speed_mps: 0.004
  tcp_clearance_m: 0.002

randomization:
  xy_m: 0.02
  yaw_deg: 15.0
  # 前侧圆弧的几何起点和最大扫掠角均随 episode 改变。
  arc_start_range_deg: 10.0
  arc_sweep_range_deg: 10.0
  # 双向各占一半；反向时专家会补偿行走角和滚转角，保持物理焊枪姿态可达。
  reverse_probability: 0.5
  # 标称 4 mm/s 仅在 3–5 mm/s 内变化，避免高速圆弧产生持续径向跟踪偏差。
  speed_range_mps: 0.001

collection:
  dataset_root: datasets/weldpath_pipe_bottom_raw_v2
