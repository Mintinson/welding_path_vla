workpiece:
  kind: pipe_on_plate

task:
  instruction: 沿圆管与底板连接处的下圆弧完成角焊轨迹。
  seam_id: pipe_bottom
  direction: forward
  # 真实可达工作区内的前侧四分之一圆弧；可按实验需要覆盖修改。
  arc_start_deg: -90.0
  arc_sweep_deg: 90.0
  # 接近阶段继承 60 mm/s；焊接阶段降为 4 mm/s。
  speed_mps: 0.004
  tcp_clearance_m: 0.002

randomization:
  xy_m: 0.03
  yaw_deg: 30.0

collection:
  dataset_root: datasets/weldpath_pipe_bottom_raw_v2
