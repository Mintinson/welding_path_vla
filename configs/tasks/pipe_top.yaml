workpiece:
  kind: pipe_on_plate

task:
  task_id: pipe_top
  instruction: Weld along the circular seam around the top rim of the pipe.
  seam_id: pipe_top
  direction: forward
  # 上圆完整执行一周；进度提示负责消除首尾同点造成的投影歧义。
  arc_start_deg: -90.0
  arc_sweep_deg: 360.0
  # 接近阶段继承 60 mm/s；焊接阶段以 15 mm/s 为中心随机变化。
  speed_mps: 0.015
  tcp_clearance_m: 0.002
  # 枪身近似竖直并保持起点姿态，避免整圆时腕部无意义地旋转 360°。
  work_angle_deg: 0.0
  travel_angle_deg: 0.0
  orientation_follow_ratio: 0.0

randomization:
  xy_m: 0.015
  yaw_deg: 10.0
  # 保持完整一周，仅小幅改变起点和焊枪姿态。
  arc_start_range_deg: 15.0
  arc_sweep_range_deg: 0.0
  work_angle_range_deg: 2.0
  travel_angle_range_deg: 2.0
  tool_roll_range_deg: 3.0
  orientation_follow_range: 0.03
  # 双向各占一半；反向时专家会补偿行走角和滚转角，保持物理焊枪姿态可达。
  reverse_probability: 0.5
  # speed_range_mps 是中心值的 ± 扰动，因此实际速度严格落在 10–20 mm/s。
  speed_range_mps: 0.008

collection:
  dataset_root: datasets/weldpath_pipe_top_raw_v2

deployment:
  # 15 mm/s 完整圆周约需 21 秒，仍为接近、退出和策略修正保留余量。
  max_steps: 3300
