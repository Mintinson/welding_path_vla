workpiece:
  kind: l_joint
  l_joint_length_m: 0.30
  l_joint_width_m: 0.10
  l_joint_thickness_m: 0.005

task:
  task_id: l_joint
  instruction: Weld along the straight fillet seam of the L-shaped workpiece.
  seam_id: straight_fillet
  direction: forward
  approach_speed_mps: 0.06
  speed_mps: 0.03
  retreat_speed_mps: 0.04
  orientation_follow_ratio: 1.0
  work_angle_deg: 45.0
  travel_angle_deg: 10.0
  tool_roll_deg: -20.0
  approach_distance_m: 0.04
  staging_clearance_m: 0.18
  retreat_distance_m: 0.04
  seam_length_m: 0.20
  tcp_clearance_m: 0.0015

randomization:
  # L 型工件使用旧数据验证过的宽关节范围，增加不同轴 1 初始构型的覆盖。
  joint_degs: [60, 20, 20, 30, 60, 60]
  # 当前反向焊枪姿态超出 Elfin5-Pro 可达范围，避免整组 staging IK 连续失败。
  reverse_probability: 0.0

collection:
  dataset_root: datasets/weldpath_raw_v2
