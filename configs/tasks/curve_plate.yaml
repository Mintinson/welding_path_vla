workpiece:
  kind: curve_plate
  curve_plate_size_m: [0.30, 0.30, 0.005]
  curve_visual_segments: 80

task:
  instruction: Weld along the periodic curved seam on the flat plate.
  seam_id: curve_seam
  direction: forward
  curve_kind: sine
  curve_amplitude_m: 0.020
  curve_frequency: 1.5
  approach_speed_mps: 0.06
  speed_mps: 0.015
  retreat_speed_mps: 0.04
  # 整段保持起点姿态，任务只考察曲线位置执行能力。
  orientation_follow_ratio: 0.0
  work_angle_deg: 0.0
  travel_angle_deg: 0.0
  tool_roll_deg: -20.0
  approach_distance_m: 0.04
  staging_clearance_m: 0.18
  retreat_distance_m: 0.04
  seam_length_m: 0.22
  tcp_clearance_m: 0.002

randomization:
  xy_m: 0.03
  yaw_deg: 10.0
  curve_amplitude_range_m: 0.010
  curve_frequency_range: 0.5
  cosine_probability: 0.5
  speed_range_mps: 0.003
  # 防止几何曲线变化同时引入姿态变化这一混杂因素。
  work_angle_range_deg: 0.0
  travel_angle_range_deg: 0.0
  tool_roll_range_deg: 0.0
  orientation_follow_range: 0.0

collection:
  dataset_root: datasets/weldpath_curve_plate_raw_v2

deployment:
  max_steps: 1500
