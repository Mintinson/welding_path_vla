timing:
  physics_hz: 600
  control_hz: 120
  policy_hz: 30

camera:
  width: 640
  height: 480
  global_name: global
  wrist_name: wrist
  global_fovy_deg: 55.0
  wrist_fovy_deg: 85.0
  # 无头采集使用 EGL；sim view 仍使用 GLFW 创建交互窗口。
  offscreen_backend: egl
  # link6 局部坐标：安装架仍与负 Y 侧螺钉对齐，镜头光心沿光轴前移 40 mm。
  wrist_position_link6_m: [0.008607, -0.071891, 0.172212]
  wrist_target_link6_m: [0.057557, -0.025778, 0.389520]
  wrist_up_link6: [0.0, 0.0, -1.0]

scene:
  table_center_m: [0.35, 0.0, 0.27]
  table_half_size_m: [0.55, 0.45, 0.02]
  robot_base_position_m: [0.0, 0.0, 0.29]
  robot_base_yaw_deg: -90.0
  workpiece_position_m: [0.45, 0.0, 0.2925]
  # 全局相机安装在 table_frame 上，以下外参均使用桌面局部坐标。
  global_camera_position_table_m: [0.90, 0.0, 0.78]
  global_camera_target_table_m: [0.10, 0.0, 0.0225]
  global_camera_up_table: [0.0, 0.0, 1.0]

robot:
  model_id: elfin5pro_photo_layout_v6
  model_asset: elfin5/elfin5pro_robot.xml
  initial_joint_deg: [90.9411, -72.1133, 22.0613, 45.5546, 128.4704, -51.3849]
  joint_velocity_limit: 1.57
  ik_damping: 0.01
  ik_max_step: 0.08
  ik_tolerance: 0.0005
  ik_iterations: 80

real_robot:
  enabled: false
  host: null
  port: 10003
  connect_timeout_s: 3.0
  command_timeout_s: 0.1
  control_mode: servo_j

safety:
  enabled: true
  joint_position_margin_rad: 0.02
  joint_velocity_limit_rad_s: 1.57
  tcp_speed_limit_m_s: 0.40
  command_timeout_s: 0.10
  # 亚毫米穿透属于离散仿真的数值擦碰；更深接触再依据接触力判断。
  tip_contact_penetration_limit_m: 0.0005
  tip_contact_force_limit_n: 3.0

randomization:
  xy_m: 0.05
  z_m: 0.0
  yaw_deg: 15.0
  # staging 构型附近六个关节的最大独立偏移（度）。
  joint_degs: [60, 20, 20, 30, 60, 60]
  # 轴 1 使用绝对角度均匀采样，使初始 TCP 覆盖工作区左右两侧。
  initial_joint1_range_deg: [30, 150]
  # 对不可达或发生碰撞的随机工件位姿进行确定性重采样。
  max_sampling_attempts: 10
  initial_tcp_m: 0.03
  recovery_probability: 0.25
  recovery_position_m: 0.003
  recovery_rotation_deg: 2.0
  # 每组 episode 采样一次焊枪姿态和执行方向；不可达或碰撞 staging 会被拒绝。
  work_angle_range_deg: 3.0
  travel_angle_range_deg: 3.0
  tool_roll_range_deg: 5.0
  orientation_follow_range: 0.05
  arc_start_range_deg: 0.0
  arc_sweep_range_deg: 0.0
  # 速度以 m/s 采样并保留三位小数。
  approach_speed_range_mps: 0.005
  speed_range_mps: 0.01
  retreat_speed_range_mps: 0.005
  reverse_probability: 0.5
  # 每 10 个 episode 编号共享方向、姿态、圆弧和速度参数。
  task_group_size: 10

collection:
  dataset_root: datasets/weldpath_raw_v2
  episodes: 50
  max_attempt_multiplier: 3
  seed: 20260823
  # 原始数据和 rollout 统一由 LeRobot / PyAV 写入可直接预览的 H.264 MP4。
  headless: true
  # 每个 worker 独立持有 MuJoCo / EGL 环境；显存不足时改为 1 或 2。
  workers: 4

quality:
  minimum_progress: 0.98
  cross_track_mean_m: 0.001
  cross_track_p95_m: 0.002
  cross_track_max_m: 0.01
  orientation_p95_deg: 2.0
  orientation_max_deg: 5.0

evaluation:
  pcr_min: 0.95
  direction_ratio_min: 0.90
  tracking_band_m: 0.01
  cte_rmse_m: 0.0015
  cte_p95_m: 0.002
  cte_max_m: 0.005
  orientation_p95_deg: 2.0
  speed_mape_max: 0.20
  jerk_ratio_max: 2.0
  jerk_min_sample_rate_hz: 80.0
  jerk_reference_floor_m_s3: 0.001
  joint_acceleration_limit_rad_s2: 10.0
  require_smoothness_for_success: false

policy:
  family: smolvla
  checkpoint: null
  device: cuda
  # 30 Hz 下覆盖未来 1 秒，每执行约 0.27 秒重新预测并共享同一 TCP 锚点。
  action_horizon: 30
  action_steps: 8
  action_stride: 1
  action_representation: relative_action
  action_source: safe_command
  parameters: {}

training:
  dataset_repo_id: null
  dataset_root: datasets/weldpath_lerobot_relative_v1
  output_dir: outputs/train
  batch_size: 16
  steps: 100000
  num_workers: 4
  video_backend: torchcodec
  eval_split: 0.1
  eval_steps: 2000
  max_eval_samples: 1000
  log_freq: 100
  save_freq: 10000
  seed: 20260724
  # 默认离线记录到 output_dir/wandb；联网后可使用 wandb sync 上传。
  wandb: true
  wandb_mode: offline
  wandb_project: welding_path_vla
  # checkpoint 已由 LeRobot 单独保存，避免 W&B 再复制一份大型模型。
  wandb_disable_artifact: true
  amp_dtype: bfloat16
  resume: false
  peft: null

policy_evaluation:
  batch_size: 4
  num_workers: 2
  max_batches: 50
  held_out_episodes: 9
  output_dir: outputs/evaluation/policies

lerobot_export:
  incremental: false
  start_episode: null
  end_episode: null
  # 默认只保留 MP4；true 时改为逐帧图片格式。
  save_images: false
  # 流式编码跳过临时 PNG，两个相机由独立编码线程并行处理。
  streaming_encoding: true
  parallel_video_encoding: true
  image_writer_processes: 0
  image_writer_threads: 8
  # 每个相机最多缓存 30 帧，每路使用 4 个线程，限制峰值内存和 CPU 竞争。
  encoder_queue_maxsize: 30
  encoder_threads: 4
  # 默认 AV1 优先保留视频质量；需要更快转换时可改为 h264 + veryfast。
  video_codec: libsvtav1
  # video_codec: h264
  video_quality: 30
  video_preset: 12

deployment:
  dry_run: true
  # 默认输出到 output_root/{policy.family}_{task.task_id}。
  output_root: outputs/deploy
  log_dir: outputs/deploy
  auto_log_dir: true
  run_all_tasks: false
  task_config_dir: configs/tasks
  episodes: 5
  max_steps: 1000
  seed: 20260724
  record_video: true
  # null 保留 checkpoint 的推理参数；部署时可用 CLI 单独覆盖，不影响训练配置。
  action_steps: null
  inference_steps: null
  completion_progress_min: 0.95
  completion_distance_m: 0.01
