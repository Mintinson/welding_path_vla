includes:
  - pi0_5_a100.yaml

# High-throughput profile for two 40GB A100 GPUs. The parent file keeps
# LoRA, a frozen vision encoder, and action-expert-only training.
policy:
  parameters:
    # At batch 2, the measured peak is only about 9 GB per GPU. Avoid
    # activation recomputation and let Inductor optimize the steady-state loop.
    gradient_checkpointing: false
    compile_model: true
    compile_mode: reduce-overhead

training:
  # Preserve the full 459,253-step schedule and global batch size of 4.
  output_dir: outputs/train/pi0_5_weldpath_relative_v1_a100_fast
  batch_size: 2
  steps: 459253
