policy:
  family: xvla
  checkpoint: null
  device: cuda
  # 与其他基线统一使用 30 帧 relative-action chunk，并闭环执行 8 帧。
  action_horizon: 30
  action_steps: 8
  action_source: safe_command
  welding_prompt_fields:
    - direction
    - welding_speed
    - work_angle
    - travel_angle
    - tool_roll
  parameters:
    pretrained_model: lerobot/xvla-base
    dtype: bfloat16
    # 当前数据为 9D 连续 SE(3) relative action；auto 负责补齐到预训练的 20D。
    action_mode: auto
    max_action_dim: 20
    max_state_dim: 20
    # 保持基础模型的三视角结构；当前双相机输入会自动零填充第三视角。
    num_image_views: 3
    resize_imgs_with_padding: [224, 224]
    tokenizer_max_length: 160
    num_denoising_steps: 10
    # 官方 Phase-II 配方：VLM、policy transformer 与 soft prompts 联合微调。
    freeze_vision_encoder: false
    freeze_language_encoder: false
    train_policy_transformer: true
    train_soft_prompts: true
    scheduler_warmup_steps: 1000
    scheduler_decay_steps: 7105955

training:
  dataset_repo_id: mintinson/weldpath_relative_v1
  dataset_root: datasets/lerobot/weldpath_lerobot_relative_v3
  output_dir: outputs/train_v2/xvla_weldpath_relative_v1
  batch_size: 1
  # Current v3 split has 7,105,955 training frames; batch 1 covers one epoch.
  steps: 7105955
  num_workers: 4
  video_backend: torchcodec
  eval_split: 0.1
  eval_steps: 200000
  max_eval_samples: 60
  log_freq: 20
  save_freq: 500000
  seed: 20260908
  amp_dtype: bfloat16
  resume: false
  peft: null

policy_evaluation:
  batch_size: 1
  num_workers: 2
  max_batches: 30
  held_out_episodes: 9
  output_dir: outputs/evaluation/policies

deployment:
  dry_run: false
  episodes: 3
  max_steps: 3300
  seed: 20260908
  record_video: true
  # 仅仿真部署：将混合位姿 IK 残差停止线从默认 0.005 放宽到 0.010。
  max_ik_residual: 0.01
  # 每个 30 Hz 控制步最大平移目标增量；默认 0.40/30=0.0133 m。
  max_target_increment_m: 0.02
  completion_progress_min: 0.85
  completion_distance_m: 0.015
