includes:
  - traj_vla_qwen.yaml

policy:
  parameters:
    compile_model: true
    compile_mode: reduce-overhead
    scheduler_warmup_steps: 4000
    scheduler_decay_steps: 200000

training:
  output_dir: outputs/train/traj_vla_qwen_weldpath_relative_v1_a100
  # 每卡 batch 16，双卡全局 batch 32；约完整遍历训练集一次。
  batch_size: 16
  steps: 200000
  num_workers: 8
  eval_steps: 10000
  save_freq: 20000
  resume: false
  lr: 5.0e-5
