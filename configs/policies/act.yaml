policy:
  family: act
  checkpoint: null
  device: cuda
  # 30 Hz 下预测未来 1 秒，每次闭环执行约 0.27 秒后重新规划。
  action_horizon: 30
  action_steps: 8
  action_source: safe_command
  parameters:
    use_amp: true
    vision_backbone: resnet18
    pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
    dim_model: 512
    n_heads: 8
    dim_feedforward: 3200
    n_encoder_layers: 4
    n_decoder_layers: 1
    use_vae: true
    latent_dim: 32
    n_vae_encoder_layers: 4
    kl_weight: 10.0

training:
  dataset_repo_id: huayan/weldpath_relative_v1
  dataset_root: /run/media/mintinson/DataDiskD/welding_path_vla/lerobot/weldpath_relative_v1
  output_dir: outputs/train/act_weldpath_relative_v1
  batch_size: 2
  # 3,674,023 个训练帧 / batch 2，约为完整遍历一次训练集。
  steps: 1837012
  num_workers: 4
  # TorchCodec 负责训练期随机解码；Pixi 按 PyTorch ABI 固定对应版本。
  video_backend: torchcodec
  eval_split: 0.1
  eval_steps: 100000
  max_eval_samples: 1000
  log_freq: 100
  save_freq: 250000
  seed: 20260724
  # RTX 40 系使用 BF16；FP16 smoke 中 ACT 梯度会溢出并被 GradScaler 跳过。
  amp_dtype: bfloat16

policy_evaluation:
  batch_size: 4
  num_workers: 2
  max_batches: 50
  held_out_episodes: 9
  output_dir: outputs/evaluation/policies

deployment:
  dry_run: false
  episodes: 5
  max_steps: 1000
  seed: 20260724
  record_video: true
  # ACT 用于验证 pipeline；达到 85% 且距焊缝不超过 15 mm 时自然退出。
  # 论文 evaluation 阈值保持统一，不受这两个部署条件影响。
  completion_progress_min: 0.85
  completion_distance_m: 0.015
