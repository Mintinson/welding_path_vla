includes:
  - pi0_5.yaml

policy:
  # 双 A100 正式训练恢复 1 秒动作块和官方推理步数。
  action_horizon: 30
  action_steps: 8
  parameters:
    num_inference_steps: 10
    freeze_vision_encoder: true
    train_expert_only: false
    scheduler_warmup_steps: 18000
    scheduler_decay_steps: 918506

training:
  output_dir: outputs/train/pi0_5_weldpath_relative_v1_a100
  # accelerate 的每个进程使用 batch 2；双卡有效 batch 为 4。
  batch_size: 2
  # 双卡有效 batch 4；918,506 step 约为完整遍历一次训练集。
  steps: 918506
  num_workers: 8
  eval_steps: 50000
  max_eval_samples: 300
  log_freq: 50
  save_freq: 100000
  resume: false
  peft: null
