includes:
  - pi0.yaml

policy:
  # 双 A100 正式训练恢复 1 秒动作块和官方推理步数。
  action_horizon: 30
  action_steps: 8
  parameters:
    num_inference_steps: 10
    compile_model: true
    compile_mode: reduce-overhead
    freeze_vision_encoder: true
    train_expert_only: false
    scheduler_warmup_steps: 9000
    scheduler_decay_steps: 459253

training:
  output_dir: outputs/train/pi0_weldpath_relative_v1_a100
  # 每卡 batch 4，双卡全局 batch 8；约完整遍历训练集一次。
  batch_size: 4
  steps: 459253
  num_workers: 8
  eval_steps: 25000
  max_eval_samples: 300
  log_freq: 50
  save_freq: 50000
  resume: false
  peft: null
