policy:
  family: pi0
  checkpoint: null
  device: cuda
  # 与其他策略统一使用 1 秒 relative action chunk。
  action_horizon: 30
  action_steps: 8
  action_source: safe_command
  parameters:
    pretrained_model: lerobot/pi0_base
    dtype: bfloat16
    num_inference_steps: 5
    gradient_checkpointing: true
    compile_model: false
    freeze_vision_encoder: true
    # 先冻结 VLM；下方 LoRA 再开启动作专家中少量可训练适配参数。
    train_expert_only: true
    scheduler_warmup_steps: 75000
    scheduler_decay_steps: 3674023

training:
  dataset_repo_id: huayan/weldpath_relative_v1
  dataset_root: /run/media/mintinson/DataDiskD/welding_path_vla/lerobot/weldpath_relative_v1
  output_dir: outputs/train/pi0_weldpath_relative_v1
  batch_size: 1
  # 单卡 batch 1；3,674,023 step 约为完整遍历一次训练集。
  steps: 3674023
  num_workers: 2
  video_backend: torchcodec
  eval_split: 0.1
  eval_steps: 200000
  max_eval_samples: 60
  log_freq: 20
  save_freq: 500000
  seed: 20260730
  amp_dtype: bfloat16
  resume: false
  # LoRA 只适配动作专家的注意力和投影层，使完整官方模型可在低显存设备上微调。
  peft:
    method_type: LORA
    r: 4
    lora_alpha: 8

policy_evaluation:
  batch_size: 1
  num_workers: 2
  max_batches: 30
  held_out_episodes: 9
  output_dir: outputs/evaluation/policies

deployment:
  dry_run: false
  episodes: 3
  max_steps: 3300
  seed: 20260730
  record_video: true
  completion_progress_min: 0.85
  completion_distance_m: 0.015
