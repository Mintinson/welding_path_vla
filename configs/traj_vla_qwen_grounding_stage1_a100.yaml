includes:
  - traj_vla_qwen_a100.yaml

policy:
  parameters:
    use_geometry_grounding: true
    use_motion_latent: false
    training_stage: grounding_warmup
    geometry_aux_loss_weights: [1.0, 0.5, 0.5]
    scheduler_warmup_steps: 500
    scheduler_decay_steps: 10000

training:
  output_dir: outputs/train/traj_vla_qwen_grounding_stage1_a100
  steps: 10000
  eval_steps: 2000
  save_freq: 5000
